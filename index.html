<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Jadwal sepak bola pria: Premier League, LaLiga, Serie A, Champions League, Eredivisie, Liga Europa, dan timnas. Jam selalu WIB.">
<meta name="theme-color" content="#080d18">
<title>BolBolaKu — Jadwal Sepak Bola</title>

<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./assets/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<div class="app">

  <!-- ============ HEADER ============ -->
  <header class="header">
    <div class="header__bar">
      <a class="brand" href="./" aria-label="BolBolaKu — beranda">
        <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="14" fill="none" stroke="#16a34a" stroke-width="2"/>
          <path d="M16 7l5 3.6-1.9 5.9h-6.2L11 10.6z" fill="#16a34a"/>
          <path d="M16 25.2l-5-3.6 1.9-5.9h6.2l1.9 5.9z" fill="#0b1220" stroke="#16a34a" stroke-width="1.4"/>
        </svg>
        <span class="brand__name">BolBolaKu</span>
      </a>

      <div class="search" role="search">
        <svg class="search__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>
        </svg>
        <label class="sr-only" for="search">Cari tim, liga, atau stadion</label>
        <input id="search" class="search__input" type="search" placeholder="Cari tim atau liga…" autocomplete="off">
      </div>

      <!-- Notifikasi adalah AKSI, bukan filter. Karena itu ia tinggal di
           header sebagai tombol lonceng, bukan tercampur dengan chip rentang
           tanggal yang mengubah daftar. -->
      <button class="iconbtn" id="notify" aria-label="Aktifkan notifikasi jelang kick-off" title="Notifikasi jelang kick-off">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path d="M6 9a6 6 0 0 1 12 0c0 4.2 1.2 5.6 1.8 6.3H4.2C4.8 14.6 6 13.2 6 9z"/>
          <path d="M10 19a2 2 0 0 0 4 0"/>
        </svg>
      </button>

      <div class="sync" id="sync" data-state="loading" role="status" aria-live="polite">
        <span class="sync__dot" aria-hidden="true"></span>
        <span id="sync-text">Memuat…</span>
      </div>
    </div>
  </header>

  <!-- ============ FILTER ============ -->
  <nav class="filters" aria-label="Filter jadwal">
    <div class="filters__inner">

      <!-- Baris tetap: jenis kompetisi + rentang hari + favorit + panel
           lanjutan. Ramping, supaya jadwal sudah terlihat di layar pertama. -->
      <div class="filterbar">
        <div class="strip" id="kindstrip" role="group" aria-label="Jenis kompetisi"></div>

        <span class="filterbar__sep" aria-hidden="true"></span>

        <div class="strip" id="ranges" role="group" aria-label="Rentang hari">
          <button class="chip" data-range="1">Hari ini</button>
          <button class="chip" data-range="3">3 hari</button>
        </div>

        <button class="chip chip--toggle" id="favonly" aria-pressed="false">
          <svg class="chip__icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3.6l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8L3.6 9.7l5.8-.8z"/>
          </svg>Favorit
        </button>

        <button class="chip chip--toggle" id="advtoggle" aria-expanded="false"
                aria-controls="advpanel">
          <svg class="chip__icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 6h16M7 12h10M10 18h4"/>
          </svg>Saring
        </button>
      </div>

      <!-- Panel lanjutan (dilipat): grup, liga spesifik, negara, klub. -->
      <div class="filters__adv" id="advpanel" hidden>

        <div class="filterrow">
          <span class="filterrow__label" id="lbl-group">Wilayah</span>
          <div class="strip" id="groupstrip" role="tablist" aria-labelledby="lbl-group"></div>
        </div>

        <div class="filterrow">
          <span class="filterrow__label" id="lbl-comp">Liga</span>
          <div class="strip-wrap">
            <div class="strip" id="compstrip" aria-labelledby="lbl-comp"></div>
          </div>
        </div>

        <div class="filterrow">
          <span class="filterrow__label" id="lbl-more">Tim</span>

          <label class="sr-only" for="country">Negara</label>
          <select id="country" class="select" aria-labelledby="lbl-more"></select>

          <label class="sr-only" for="team">Klub atau tim</label>
          <select id="team" class="select"></select>
        </div>

      </div>

    </div>
  </nav>

  <!-- ============ KONTEN ============ -->
  <main class="main">

    <!-- Countdown kick-off berikutnya -->
    <div class="countdown" id="countdown" hidden>
      <span class="countdown__label">Laga berikutnya dimulai dalam</span>
      <span class="countdown__clock" id="cd-clock">--:--:--</span>
      <span class="countdown__teams" id="cd-teams"></span>
      <span class="countdown__meta" id="cd-meta"></span>
    </div>

    <p class="sr-only" aria-live="polite" id="count"></p>

    <div id="list" role="list"></div>

    <div class="state" id="empty" hidden></div>

  </main>

  <!-- ============ FOOTER ============ -->
  <footer class="footer">
    Jadwal dari ESPN&nbsp;&middot; Jam selalu <strong>WIB</strong> (UTC+7) &middot;
    <span id="total">—</span> pertandingan
  </footer>

</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="./app.js"></script>
</body>
</html>
